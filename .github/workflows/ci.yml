name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch on a new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- BACKEND ----------
  lint-backend:
    name: Lint Backend (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php-8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php-8.3-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Pint (lint check, no fixes)
        run: vendor/bin/pint --test --no-interaction

  static-analysis:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php-8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php-8.3-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan (level 5, with baseline)
        # The phpstan-baseline.neon file tracks pre-existing issues so we
        # only fail on NEW problems introduced by this PR.
        #
        # NOTE: this job used to be silently useless. The baseline
        # referenced two files that no longer exist
        # (app/Models/Billing/Installment.php and
        # app/Services/Billing/InstallmentService.php), which makes
        # PHPStan exit 1 with "Invalid entries in ignoreErrors" and
        # analyse nothing at all. The baseline was regenerated from the
        # real current state in commit 533f1fc4, and the gate now
        # actually runs.
        #
        # The generic-Eloquent-Model family of errors is suppressed by a
        # narrow, documented ignore in phpstan.neon (one root cause
        # documented once) rather than by hundreds of baseline entries.
        #
        # To retire fixed issues from the baseline, regenerate it:
        #   vendor/bin/phpstan analyse --generate-baseline=phpstan-baseline.neon
        # (remove the baseline include from phpstan.neon first, or
        # PHPStan will read the baseline it is replacing).
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  tenant-scope-check:
    name: Tenant Scope Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Check tenant scope
        run: bash scripts/check-tenant-scope.sh

  # ---------- DEPENDENCY SECURITY ----------
  #
  # `composer audit` and `npm audit` are read-only checks against the
  # published advisory databases — they install nothing and change no
  # lockfile. Running them in CI means a newly published advisory
  # surfaces on the PR that introduces the dependency instead of
  # months later.
  #
  # The audit is currently NON-BLOCKING (continue-on-error) because
  # the repository currently carries known advisories:
  #
  #   composer: 60 advisories across 15 packages (mostly transitive
  #             dev/optional packages — see the Batch 7 remediation).
  #   npm:      7 advisories — postcss, source-map-js and nanoid are
  #             build-time only; dompurify and lodash-es are runtime
  #             but NOT reachable in current usage (no IN_PLACE /
  #             SAFE_FOR_TEMPLATES on DOMPurify; only { debounce } is
  #             imported from lodash-es).
  #
  # Flip `continue-on-error` to `false` once those are cleared, so the
  # job starts failing on new advisories.
  audit-composer:
    name: Audit Composer Dependencies
    runs-on: ubuntu-latest
    continue-on-error: true # TODO: make blocking once the 60 known advisories are cleared
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run composer audit
        run: composer audit --locked --no-interaction

  audit-npm:
    name: Audit npm Dependencies
    runs-on: ubuntu-latest
    continue-on-error: true # TODO: make blocking once the 7 known advisories are cleared
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run npm audit (production dependencies only)
        # --omit=dev: build-time-only packages (postcss, source-map-js,
        # nanoid) do not ship to production, so they are tracked in a
        # separate informational step rather than gating the build.
        run: npm audit --omit=dev

  test-frontend:
    name: Test Frontend (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install npm dependencies
        run: npm ci
      - name: Run Vitest
        run: npm run test

  test-backend:
    name: Test Backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-${{ matrix.php }}-
            composer-${{ runner.os }}-php-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate APP_KEY
        run: php artisan key:generate

      - name: Create SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run PHPUnit
        run: php artisan test

  # ---------- FRONTEND ----------
  type-check-frontend:
    name: Type-Check Frontend (vue-tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run vue-tsc
        run: npm run type-check

  lint-frontend:
    name: Lint Frontend (ESLint + Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  build-frontend:
    name: Build Frontend (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            public/build
            !public/build/.gitkeep
          if-no-files-found: ignore
          retention-days: 7