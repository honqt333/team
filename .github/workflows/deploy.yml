name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      allow_older:
        description: 'Allow deploying an older commit than currently active'
        required: false
        default: false
        type: boolean
      skip_migrations:
        description: 'Skip database migrations'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  guard:
    name: Target Branch Verification
    runs-on: ubuntu-latest
    steps:
      - name: Assert Target Branch is staging
        run: |
          echo "Target ref is: ${{ github.ref }}"
          if [ "${{ github.ref }}" != "refs/heads/staging" ]; then
            echo "❌ CRITICAL SAFETY ERROR: Refusing to deploy from ref '${{ github.ref }}'."
            echo "Staging deployment is strictly restricted to 'refs/heads/staging'."
            exit 1
          fi
          echo "✅ Target branch verified: staging"

  ci:
    name: Run CI Gate
    needs: guard
    uses: ./.github/workflows/ci-staging.yml

  package:
    name: Build & Package Release
    needs: [guard, ci]
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.meta.outputs.release_id }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      commit_epoch: ${{ steps.meta.outputs.commit_epoch }}
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Compute release metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          EPOCH=$(git show -s --format=%ct HEAD)
          STAMP=$(date -u +%Y%m%d_%H%M%S)
          echo "release_id=${STAMP}_${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "commit_epoch=${EPOCH}" >> "$GITHUB_OUTPUT"

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies & build frontend
        run: |
          npm ci
          npm run build

      - name: Package release archive (excluding secrets & customer data)
        run: |
          tar -czf /tmp/release.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='storage/*' \
            --exclude='*.sql' \
            --exclude='*.sql.gz' \
            --exclude='*.zip' \
            --exclude='*.tar.gz' \
            --exclude='*.log' \
            --exclude='*.report.html' \
            --exclude='.DS_Store' \
            --exclude='audit_reports' \
            --exclude='.agent' \
            --exclude='.agents' \
            --exclude='.harness' \
            --exclude='.mavis' \
            --exclude='.husky' \
            .

      - name: Verify archive security and completeness
        run: |
          if tar -tzf /tmp/release.tar.gz | grep -qE '(^|\./)(\.env(\.|$)|storage/app/|.*\.sql(\.gz)?$|.*\.pem$|.*\.key$|id_ed25519|id_rsa)'; then
            echo "ERROR: Forbidden sensitive file detected inside release archive!"
            exit 1
          fi
          if ! tar -tzf /tmp/release.tar.gz | grep -qE '(^|\./)public/build/manifest\.json$'; then
            echo "ERROR: public/build/manifest.json missing from release archive!"
            exit 1
          fi
          if ! tar -tzf /tmp/release.tar.gz | grep -qE '(^|\./)vendor/autoload\.php$'; then
            echo "ERROR: vendor/autoload.php missing from release archive!"
            exit 1
          fi
          echo "Archive security and completeness verification passed."

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: /tmp/release.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to Hostinger Staging
    needs: package
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/deploy-release.sh

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: /tmp

      - name: Setup SSH key and host verification (Pinned Key)
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -z "$SSH_KEY" ]; then
            echo "ERROR: STAGING_SSH_KEY secret is missing!"
            exit 1
          fi
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "ERROR: STAGING_SSH_KNOWN_HOSTS secret is missing! Dynamic ssh-keyscan is prohibited to protect against MitM attacks."
            exit 1
          fi
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload archive and deploy script
        env:
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            /tmp/release.tar.gz \
            scripts/deploy-release.sh \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/tmp/"

      - name: Execute remote atomic release deployment
        env:
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          RELEASE_ID: ${{ needs.package.outputs.release_id }}
          COMMIT_SHA: ${{ needs.package.outputs.commit_sha }}
          COMMIT_EPOCH: ${{ needs.package.outputs.commit_epoch }}
          ALLOW_OLDER: ${{ inputs.allow_older || 'false' }}
          SKIP_MIGRATIONS: ${{ inputs.skip_migrations || 'false' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            "${SSH_USER}@${SSH_HOST}" \
            "chmod +x '${DEPLOY_PATH}/tmp/deploy-release.sh' && \
            DEPLOY_ROOT='${DEPLOY_PATH}' \
            RELEASE_ID='${RELEASE_ID}' \
            COMMIT_SHA='${COMMIT_SHA}' \
            COMMIT_EPOCH='${COMMIT_EPOCH}' \
            ALLOW_OLDER='${ALLOW_OLDER}' \
            SKIP_MIGRATIONS='${SKIP_MIGRATIONS}' \
            ARCHIVE_PATH='${DEPLOY_PATH}/tmp/release.tar.gz' \
            bash '${DEPLOY_PATH}/tmp/deploy-release.sh'"
