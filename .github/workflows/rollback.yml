name: Rollback Staging Release

on:
  workflow_dispatch:
    inputs:
      target_release:
        description: 'Target release folder name (leave empty for previous release)'
        required: false
        default: ''
        type: string

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  rollback:
    name: Rollback Code & Assets (No DB Changes)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout rollback script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/rollback-release.sh

      - name: Setup SSH key and host verification (Pinned Key)
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -z "$SSH_KEY" ]; then
            echo "ERROR: STAGING_SSH_KEY secret is missing!"
            exit 1
          fi
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "ERROR: STAGING_SSH_KNOWN_HOSTS secret is missing! Dynamic ssh-keyscan is prohibited to protect against MitM attacks."
            exit 1
          fi
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload and execute rollback script
        env:
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          TARGET_RELEASE: ${{ inputs.target_release }}
        run: |
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            scripts/rollback-release.sh \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/tmp/"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            "${SSH_USER}@${SSH_HOST}" \
            "chmod +x '${DEPLOY_PATH}/tmp/rollback-release.sh' && \
            DEPLOY_ROOT='${DEPLOY_PATH}' \
            TARGET_RELEASE='${TARGET_RELEASE}' \
            bash '${DEPLOY_PATH}/tmp/rollback-release.sh'"
